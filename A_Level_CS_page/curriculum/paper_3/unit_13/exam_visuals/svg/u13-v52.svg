<svg xmlns="http://www.w3.org/2000/svg" width="723" height="570" viewBox="-24 -52 723 570" role="img" aria-labelledby="title desc"><title id="title">MOD, slot và địa chỉ byte</title><desc id="desc">1030 MOD 3 = 1; slot 1 tại base 4096 + 64 = 4160 bytes trong ví dụ riêng.</desc><text x="0" y="0" font-family="Consolas" font-size="27" font-weight="400" fill="#18364B" text-anchor="start">Key = 1030   |   N = 3</text><text x="0" y="74" font-family="Consolas" font-size="32" font-weight="400" fill="#18364B" text-anchor="start">1030 = 343 × 3 + 1</text><path d="M306.0,91 L324.0,91" fill="none" stroke="#B85B16" stroke-width="4"/><path d="M315.0,108 L315.0,175" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="315.0,175 309.87144143719405,164.15113429579526 320.12855856280595,164.15113429579526" fill="#B85B16"/><rect x="188.0" y="188" width="255" height="60" rx="9" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="315.5" y="225.82" font-family="Consolas" font-size="23" font-weight="700" fill="#B85B16" text-anchor="middle">Slot = 1</text><rect x="0" y="320" width="145" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="72.5" y="356.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">0</text><rect x="145" y="320" width="145" height="55" rx="2" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="217.5" y="356.5" font-family="Consolas" font-size="25" font-weight="700" fill="#B85B16" text-anchor="middle">1</text><rect x="290" y="320" width="145" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="362.5" y="356.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">2</text><text x="72" y="422" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="middle">4096</text><text x="217" y="422" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="middle">4160</text><text x="362" y="422" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="middle">4224</text><text x="495" y="351" font-family="Consolas" font-size="25" font-weight="400" fill="#18364B" text-anchor="start">4096 + 1 × 64</text><text x="495" y="407" font-family="Consolas" font-size="28" font-weight="700" fill="#B85B16" text-anchor="start">= 4160 bytes</text><text x="0" y="489" font-family="Segoe UI" font-size="21" font-weight="400" fill="#586F7B" text-anchor="start">Ví dụ địa chỉ: base 4096, record 64 bytes, slot từ 0</text></svg>