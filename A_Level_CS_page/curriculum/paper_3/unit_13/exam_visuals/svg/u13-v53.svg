<svg xmlns="http://www.w3.org/2000/svg" width="693" height="519" viewBox="-24 -50 693 519" role="img" aria-labelledby="title desc"><title id="title">Collision: cùng đường dò khi lưu và tìm</title><desc id="desc">27 và 37 hash vào 7; lưu 37 tại 8, tìm phải so key tại 7 rồi 8.</desc><text x="0" y="0" font-family="Consolas" font-size="25" font-weight="400" fill="#18364B" text-anchor="start">27 MOD 10 = 7   |   37 MOD 10 = 7</text><text x="0" y="65" font-family="Segoe UI" font-size="21" font-weight="700" fill="#007F83" text-anchor="start">LƯU 37</text><rect x="0" y="95" width="120" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="60.0" y="131.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">27</text><rect x="120" y="95" width="120" height="55" rx="2" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="180.0" y="131.5" font-family="Consolas" font-size="25" font-weight="700" fill="#B85B16" text-anchor="middle">—</text><rect x="240" y="95" width="120" height="55" rx="2" fill="#FFFFFF" stroke="#9BAEB7" stroke-width="2"/><text x="300.0" y="131.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">—</text><text x="60" y="183" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">7</text><text x="180" y="183" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">8</text><text x="300" y="183" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">9</text><path d="M60,204 L180,204" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="180,204 169.15113429579526,209.12855856280595 169.15113429579526,198.87144143719405" fill="#007F83"/><text x="420" y="126" font-family="Segoe UI" font-size="23" font-weight="400" fill="#18364B" text-anchor="start">7 đã có 27 → thử 8</text><text x="420" y="174" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="start">8 trống → lưu 37</text><text x="0" y="295" font-family="Segoe UI" font-size="21" font-weight="700" fill="#007F83" text-anchor="start">TÌM 37</text><rect x="0" y="325" width="120" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="60.0" y="361.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">27</text><rect x="120" y="325" width="120" height="55" rx="2" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="180.0" y="361.5" font-family="Consolas" font-size="25" font-weight="700" fill="#B85B16" text-anchor="middle">37</text><rect x="240" y="325" width="120" height="55" rx="2" fill="#FFFFFF" stroke="#9BAEB7" stroke-width="2"/><text x="300.0" y="361.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">—</text><text x="60" y="413" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">7</text><text x="180" y="413" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">8</text><text x="300" y="413" font-family="Consolas" font-size="20" font-weight="400" fill="#586F7B" text-anchor="middle">9</text><path d="M60,434 L180,434" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="180,434 169.15113429579526,439.12855856280595 169.15113429579526,428.87144143719405" fill="#007F83"/><text x="420" y="356" font-family="Segoe UI" font-size="23" font-weight="400" fill="#18364B" text-anchor="start">7: 27 ≠ 37 → thử 8</text><text x="420" y="404" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="start">8: 37 = 37 → tìm thấy</text></svg>