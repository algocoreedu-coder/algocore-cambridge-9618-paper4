<svg xmlns="http://www.w3.org/2000/svg" width="738" height="456" viewBox="-24 -50 738 456" role="img" aria-labelledby="title desc"><title id="title">Enum: thứ tự khai báo và chọn một giá trị</title><desc id="desc">Ba giá trị enum trên một dãy; chọn Paused, phân biệt Paused với chuỗi &quot;Paused&quot;.</desc><text x="0" y="0" font-family="Consolas" font-size="25" font-weight="400" fill="#18364B" text-anchor="start">TYPE TStatus = (Active, Paused, Completed)</text><rect x="0" y="70" width="210" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="105.0" y="107.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Active</text><text x="105" y="55" font-family="Consolas" font-size="21" font-weight="400" fill="#586F7B" text-anchor="middle">1st</text><path d="M213,100 L233,100" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="233,100 222.15113429579526,105.12855856280596 222.15113429579526,94.87144143719404" fill="#007F83"/><rect x="240" y="70" width="210" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="345.0" y="107.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Paused</text><text x="345" y="55" font-family="Consolas" font-size="21" font-weight="400" fill="#586F7B" text-anchor="middle">2nd</text><path d="M453,100 L473,100" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="473,100 462.15113429579526,105.12855856280596 462.15113429579526,94.87144143719404" fill="#007F83"/><rect x="480" y="70" width="210" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="585.0" y="107.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Completed</text><text x="585" y="55" font-family="Consolas" font-size="21" font-weight="400" fill="#586F7B" text-anchor="middle">3rd</text><rect x="230" y="255" width="290" height="60" rx="9" fill="#FFFFFF" stroke="#007F83" stroke-width="2"/><text x="375.0" y="292.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Status : TStatus</text><path d="M345,133 L345,245" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="345,245 339.87144143719405,234.15113429579526 350.12855856280595,234.15113429579526" fill="#007F83"/><text x="365" y="196.0" font-family="Segoe UI" font-size="20" font-weight="400" fill="#007F83" text-anchor="start">chọn một</text><text x="0" y="377" font-family="Consolas" font-size="24" font-weight="400" fill="#007F83" text-anchor="start">Status ← Paused</text><text x="465" y="377" font-family="Consolas" font-size="24" font-weight="400" fill="#BA3849" text-anchor="start">Status ← &quot;Paused&quot;</text><path d="M429,361 L445,377" fill="none" stroke="#BA3849" stroke-width="3"/><path d="M429,377 L445,361" fill="none" stroke="#BA3849" stroke-width="3"/></svg>