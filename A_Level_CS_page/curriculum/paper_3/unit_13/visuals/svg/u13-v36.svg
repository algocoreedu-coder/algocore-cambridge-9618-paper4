<svg xmlns="http://www.w3.org/2000/svg" width="1013" height="698" viewBox="-24 -54 1013 698" role="img" aria-labelledby="title desc"><title id="title">Sai số tích lũy qua nhiều lần cộng</title><desc id="desc">Mô hình chỉ làm tròn đầu vào: nearest của 0.1 trong 8+4 là 0.099609375 (M=01100110, E=1101). Ba tổng chính xác của đầu vào đã xấp xỉ: 0.099609375; 0.19921875; 0.298828125. Không làm tròn tổng về 8+4; ghi rõ sai số có dấu.</desc><text x="0" y="0" font-family="Consolas" font-size="29" font-weight="700" fill="#18364B" text-anchor="start">0.1 → 0.099609375</text><text x="0" y="58" font-family="Segoe UI" font-size="21" font-weight="700" fill="#007F83" text-anchor="start">M</text><rect x="0" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="21.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><rect x="43" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="64.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="86" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="107.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="129" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="150.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><rect x="172" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="193.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><rect x="215" y="75" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="236.5" y="109" font-family="Consolas" font-size="25" font-weight="700" fill="#18364