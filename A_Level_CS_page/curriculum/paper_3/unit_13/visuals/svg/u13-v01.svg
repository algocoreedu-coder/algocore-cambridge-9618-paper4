<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="316" viewBox="-24 -24 1008 316" role="img" aria-labelledby="title desc"><title id="title">Bản đồ toàn bộ Chapter 13</title><desc id="desc">Ba nhánh: thiết kế dữ liệu → tổ chức/lấy dữ liệu → biểu diễn số; mỗi nhánh có tên kỹ năng đầu ra, nối về bài toán quản lý học viên.</desc><rect x="315" y="0" width="330" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="480.0" y="37.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Learner management</text><path d="M480,60 L480,92 L145,92 L145,130" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="145,130 139.87144143719405,119.15113429579526 150.12855856280595,119.15113429579526" fill="#007F83"/><rect x="0" y="130" width="290" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="145.0" y="167.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Define data</text><text x="145" y="230" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Record / enum / pointer</text><text x="145" y="263" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Choose → define → use</text><path d="M480,60 L480,92 L480,92 L480,130" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="480,130 474.87144143719405,119.15113429579526 485.12855856280595,119.15113429579526" fill="#007F83"/><rect x="335" y="130" width="290" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="480.0" y="167.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Store &amp; find</text><text x="480" y="230" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Organisation / access</text><text x="480" y="263" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Key → location → record</text><path d="M480,60 L480,92 L815,92 L815,130" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="815,130 809.871441437194,119.15113429579526 820.128558562806,119.15113429579526" fill="#007F83"/><rect x="670" y="130" width="290" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="815.0" y="167.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Represent numbers</text><text x="815" y="230" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Mantissa / exponent</text><text x="815" y="263" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">Encode → normalise → check</text></svg>