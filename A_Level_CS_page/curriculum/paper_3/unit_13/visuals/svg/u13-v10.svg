<svg xmlns="http://www.w3.org/2000/svg" width="896" height="415" viewBox="-22 -49 896 415" role="img" aria-labelledby="title desc"><title id="title">Set: phần tử, hợp và giao</title><desc id="desc">Hai tập SkillsA={Binary,Files}, SkillsB={Files,Records}; tô miền giao Files, một khung riêng cho hợp; không lặp phần tử. Có dòng SET OF STRING liên kết với hình.</desc><text x="0" y="0" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="start">TYPE TSkillSet = SET OF STRING</text><defs><clipPath id="a"><circle cx="190" cy="185" r="115"/></clipPath></defs><circle cx="190" cy="185" r="115" fill="#EDF3F8" stroke="#18364B" stroke-width="2.5"/><circle cx="355" cy="185" r="115" fill="none" stroke="#007F83" stroke-width="2.5"/><circle cx="355" cy="185" r="115" fill="#EAF5F4" clip-path="url(#a)"/><text x="123" y="50" font-family="Segoe UI" font-size="22" font-weight="700" fill="#18364B" text-anchor="start">SkillsA</text><text x="330" y="50" font-family="Segoe UI" font-size="22" font-weight="700" fill="#007F83" text-anchor="start">SkillsB</text><text x="155" y="192" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="middle">Binary</text><text x="272" y="192" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="middle">Files</text><text x="393" y="192" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="middle">Records</text><text x="540" y="138" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="start">Intersection</text><text x="540" y="175" font-family="Consolas" font-size="23" font-weight="400" fill="#18364B" text-anchor="start">{Files}</text><text x="540" y="239" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="start">Union</text><text x="540" y="276" font-family="Consolas" font-size="23" font-weight="400" fill="#18364B" text-anchor="start">{Binary, Files, Records}</text><text x="92"