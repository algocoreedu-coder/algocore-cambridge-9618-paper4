<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="619" viewBox="-28.5 -55 1056 619" role="img" aria-labelledby="title desc"><title id="title">Overflow và underflow trên bản đồ range</title><desc id="desc">Hai ô:100×2=200 vượt max127; (1/512)/2=1/1024 nằm dưới min dương chuẩn hóa. Gắn với khung zoom gần0; phân biệt underflow với dấu âm.</desc><text x="0" y="0" font-family="Consolas" font-size="30" font-weight="700" fill="#BA3849" text-anchor="start">100 × 2 = 200</text><path d="M0,100 L1000,100" fill="none" stroke="#18364B" stroke-width="2"/><path d="M0.0,89 L0.0,112" fill="none" stroke="#18364B" stroke-width="3"/><text x="0.0" y="157" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="middle">0</text><path d="M577.2727272727273,89 L577.2727272727273,112" fill="none" stroke="#007F83" stroke-width="3"/><text x="577.2727272727273" y="157" font-family="Consolas" font-size="24" font-weight="400" fill="#007F83" text-anchor="middle">127 max</text><path d="M909.090909090909,89 L909.090909090909,112" fill="none" stroke="#BA3849" stroke-width="3"/><text x="909.090909090909" y="157" font-family="Consolas" font-size="24" font-weight="400" fill="#BA3849" text-anchor="middle">200</text><path d="M577.2727272727273,98 L1000,98" fill="none" stroke="#BA3849" stroke-width="5"/><text x="650" y="45" font-family="Segoe UI" font-size="23" font-weight="700" fill="#BA3849" text-anchor="start">OVERFLOW</text><text x="0" y="267" font-family="Consolas" font-size="30" font-weight="700" fill="#B85B16" text-anchor="start">(1/512) ÷ 2 = 1/1024</text><text x="0" y="321" font-family="Segoe UI" font-size="21" font-weight="400" fill="#586F7B" text-anchor="start">Separate linear zoom near zero</text><path d="M0,393 L1000,393" fill="none" stroke="#18364B" stroke-width="2"/><path d="M0,383 L0,403" fill="none" stroke="#18364B" stroke-width="3"/><text x="0" y="449" font-family="Consolas" font-size="23" font-weight="400" fill="#18364B" text-anchor="middle">0</text><path d="M333,383 L333,403" fill="none" stroke="#B85B16" stroke-width="3"/><text x="333" y="449" font-family="Consolas" font-size="23" font-weight="400" fill="#B85B16" text-anchor="middle">1/1024</text><path d="M666,383 L666,403" fill="none" stroke="#007F83" stroke-width="3"/><text x="666" y="449" font-family="Consolas" font-size="23" font-weight="400" fill="#007F83" text-anchor="middle">1/512 minimum</text><path d="M656,360 L343,360" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="343,360 353.84886570420474,354.87144143719405 353.84886570420474,365.12855856280595" fill="#B85B16"/><text x="510" y="339" font-family="Segoe UI" font-size="22" font-weight="700" fill="#B85B16" text-anchor="middle">UNDERFLOW</text><text x="0" y="535" font-family="Segoe UI" font-size="20" font-weight="400" fill="#586F7B" text-anchor="start">Normalised non-zero values only • 8-bit M + 4-bit E</text></svg>