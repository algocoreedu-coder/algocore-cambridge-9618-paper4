<svg xmlns="http://www.w3.org/2000/svg" width="896" height="229" viewBox="-24 -49 896 229" role="img" aria-labelledby="title desc"><title id="title">Enum và set: một lựa chọn hay nhiều phần tử?</title><desc id="desc">Hai cột: CurrentLevel chọn ASLevel hoặc ALevel; CompletedUnits chứa nhiều unit. Minh họa một giá trị enum và một tập hiện có, tránh hiểu enum là danh sách nhiều lựa chọn đồng thời.</desc><text x="0" y="0" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="start">CurrentLevel : TLevel</text><rect x="0" y="43" width="195" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="97.5" y="80.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">ASLevel</text><rect x="224" y="43" width="195" height="60" rx="9" fill="#FFFFFF" stroke="#586F7B" stroke-width="2"/><text x="321.5" y="80.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#586F7B" text-anchor="middle">ALevel</text><text x="0" y="151" font-family="Segoe UI" font-size="22" font-weight="700" fill="#007F83" text-anchor="start">One selected value</text><text x="525" y="0" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="start">CompletedUnits : TUnitSet</text><circle cx="570" cy="74" r="33" fill="#EAF5F4" stroke="#007F83" stroke-width="2.5"/><text x="570" y="84" font-family="Consolas" font-size="26" font-weight="400" fill="#18364B" text-anchor="middle">1</text><circle cx="670" cy="74" r="33" fill="#EAF5F4" stroke="#007F83" stroke-width="2.5"/><text x="670" y="84" font-family="Consolas" font-size="26" font-weight="400" fill="#18364B" text-anchor="middle">3</text><circle cx="770" cy="74" r="33" fill="#EAF5F4" stroke="#007F83" stroke-width="2.5"/><text x="770" y="84" font-family="Consolas" font-size="26" font-weight="400" fill="#18364B" text-anchor="middle">5</text><text x="525" y="151" font-family="Segoe UI" font-size="22" font-weight="700" fill="#007F83" text-anchor="start">Several distinct elements</text></svg>