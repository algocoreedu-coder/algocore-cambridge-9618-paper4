<svg xmlns="http://www.w3.org/2000/svg" width="792" height="356" viewBox="-22 -43 792 356" role="img" aria-labelledby="title desc"><title id="title">Từ dạng khoa học đến M × 2^E</title><desc id="desc">Hai dòng: 6500=6.5×10^3 và 6.5=0.1101₂×2^3. Chỉ rõ cơ số, mantissa và exponent; không đồng nhất số mũ với giá trị 2^E.</desc><text x="0" y="43" font-family="Consolas" font-size="35" font-weight="700" fill="#18364B" text-anchor="start">6500</text><text x="180" y="43" font-family="Consolas" font-size="35" font-weight="400" fill="#18364B" text-anchor="start">=</text><rect x="260" y="0" width="155" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="337.5" y="37.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">6.5</text><text x="448" y="43" font-family="Segoe UI" font-size="32" font-weight="400" fill="#18364B" text-anchor="start">×</text><rect x="505" y="0" width="100" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="555.0" y="37.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">10</text><text x="616" y="9" font-family="Consolas" font-size="26" font-weight="700" fill="#18364B" text-anchor="start">3</text><text x="335" y="98" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">mantissa</text><text x="555" y="98" font-family="Segoe UI" font-size="20" font-weight="400" fill="#18364B" text-anchor="middle">base</text><text x="669" y="1" font-family="Segoe UI" font-size="19" font-weight="400" fill="#18364B" text-anchor="start">exponent</text><text x="0" y="232" font-family="Consolas" font-size="35" font-weight="700" fill="#18364B" text-anchor="start">6.5</text><text x="180" y="232" font-family="Consolas" font-size="35" font-weight="400" fill="#18364B" text-anchor="start">=</text><rect x="260" y="189" width="220" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="370.0