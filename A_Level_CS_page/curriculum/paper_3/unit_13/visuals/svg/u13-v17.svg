<svg xmlns="http://www.w3.org/2000/svg" width="791" height="471" viewBox="-24 -24 791 471" role="img" aria-labelledby="title desc"><title id="title">Sequential search: tìm và dừng sớm</title><desc id="desc">Tìm 20 trong 12,18,25,31; con trỏ đọc lần lượt 12→18→25 rồi dừng vì 25&gt;20. Nhánh phụ: serial chưa sắp không dùng được điều kiện dừng này.</desc><rect x="0" y="0" width="220" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="110.0" y="37.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Find key 20</text><rect x="0" y="100" width="125" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="62.5" y="136.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">12</text><rect x="125" y="100" width="125" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="187.5" y="136.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">18</text><rect x="250" y="100" width="125" height="55" rx="2" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="312.5" y="136.5" font-family="Consolas" font-size="25" font-weight="700" fill="#B85B16" text-anchor="middle">25</text><rect x="375" y="100" width="125" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="437.5" y="136.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">31</text><path d="M62,174 L187,174" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="187,174 176.15113429579526,179.12855856280595 176.15113429579526,168.87144143719405" fill="#007F83"/><path d="M187,174 L312,174" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="312,174 301.15113429579526,179.12855856280595 301.15113429579526,168.87144143719405" fill="#007F83"/><path d="M312,183 L312,235" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="312,235 306.87144143719405,224.15113429579526 317.12855856280595,224.15113429579526" fill="#B85B16"/><rect x="167" y="249" width="300" height="60" rx="9" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="317.0" y="286.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#B85B16" text-anchor="middle">25 &gt; 20 → stop</text><text x="187" y="355" font-family="Segoe UI" font-size="22" font-weight="400" fill="#18364B" text-anchor="start">20 is not in the sorted file</text><text x="558" y="132" font-family="Segoe UI" font-size="21" font-weight="400" fill="#586F7B" text-anchor="start">31 need not be read</text><text x="0" y="418" font-family="Segoe UI" font-size="21" font-weight="400" fill="#586F7B" text-anchor="start">Early stop requires ascending key order</text></svg>