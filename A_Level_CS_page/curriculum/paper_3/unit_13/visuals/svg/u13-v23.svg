<svg xmlns="http://www.w3.org/2000/svg" width="1021" height="428" viewBox="-24 -47 1021 428" role="img" aria-labelledby="title desc"><title id="title">Collision với overflow area</title><desc id="desc">Slot chính2 chứa12; 17 và22 ở vùng tràn. Tìm22 kiểm tra key12 rồi lần lượt vùng tràn. Tách bố cục vùng chính/vùng tràn và thể hiện đường truy hồi.</desc><text x="0" y="0" font-family="Segoe UI" font-size="22" font-weight="700" fill="#18364B" text-anchor="start">Main area</text><text x="615" y="0" font-family="Segoe UI" font-size="22" font-weight="700" fill="#18364B" text-anchor="start">Overflow area</text><rect x="0" y="35" width="280" height="91" rx="9" fill="#FFFFFF" stroke="#007F83" stroke-width="2"/><rect x="0" y="35" width="280" height="48" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="16" y="67" font-family="Consolas" font-size="23" font-weight="700" fill="#18364B" text-anchor="start">Slot 2</text><text x="14" y="112" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">key</text><text x="266" y="112" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">12</text><rect x="615" y="35" width="335" height="134" rx="9" fill="#FFFFFF" stroke="#007F83" stroke-width="2"/><rect x="615" y="35" width="335" height="48" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="631" y="67" font-family="Consolas" font-size="23" font-weight="700" fill="#18364B" text-anchor="start">Overflow records</text><text x="629" y="112" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">first key</text><text x="936" y="112" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">17</text><rect x="617" y="127" width="331" height="41" rx="0" fill="#FFF1E2" stroke="none" stroke-width="2"/><path d="M615,126 L950,126" fill="none" stroke="#9BAEB7" stroke-width="2"/><text x="629" y="155" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">next key</text><text x="936" y="155" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">22</text><path d="M292,102 L605,102" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="605,102 594.1511342957953,107.12855856280596 594.1511342957953,96.87144143719404" fill="#007F83"/><text x="448.5" y="90.0" font-family="Segoe UI" font-size="20" font-weight="400" fill="#007F83" text-anchor="middle">collision records</text><rect x="0" y="244" width="240" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="120.0" y="281.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Find key 22</text><path d="M250,274 L385,274" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="385,274 374.15113429579526,279.12855856280595 374.15113429579526,268.87144143719405" fill="#007F83"/><text x="405" y="281" font-family="Consolas" font-size="24" font-weight="400" fill="#18364B" text-anchor="start">12 ≠ 22 → 17 ≠ 22 → 22 = 22</text><text x="620" y="352" font-family="Segoe UI" font-size="21" font-weight="400" fill="#007F83" text-anchor="start">Match the key before using the record</text></svg>