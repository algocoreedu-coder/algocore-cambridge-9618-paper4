<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="341" viewBox="-24 -24 1068 341" role="img" aria-labelledby="title desc"><title id="title">Hash khóa chuỗi bằng tổng mã ký tự</title><desc id="desc">AC và CA tách thành mã65/67; cùng tổng132, MOD10=2. Cho thấy đổi thứ tự ký tự vẫn có thể cùng hash ở phương pháp đơn giản này.</desc><rect x="0" y="0" width="120" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="60.0" y="37.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">AC</text><path d="M130,30 L200,30" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="200,30 189.15113429579526,35.12855856280596 189.15113429579526,24.871441437194044" fill="#007F83"/><rect x="212" y="0" width="215" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="319.5" y="37.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">65 + 67</text><path d="M437,30 L507,30" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="507,30 496.15113429579526,35.12855856280596 496.15113429579526,24.871441437194044" fill="#007F83"/><rect x="519" y="0" width="255" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="646.5" y="37.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">132 MOD 10</text><rect x="0" y="160" width="120" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="60.0" y="197.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">CA</text><path d="M130,190 L200,190" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="200,190 189.15113429579526,195.12855856280595 189.15113429579526,184.87144143719405" fill="#007F83"/><rect x="212" y="160" width="215" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="319.5" y="197.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">67 + 65</text><path d="M437,190 L507,190" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="507,190 496.15113429579526,195.12855856280595 496.15113429579526,184.87144143719405" fill="#007F83"/><rect x="519" y="160" width="255" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="646.5" y="197.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">132 MOD 10</text><rect x="900" y="80" width="120" height="60" rx="9" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="960.0" y="117.82" font-family="Consolas" font-size="23" font-weight="700" fill="#B85B16" text-anchor="middle">2</text><path d="M785,30 L840,30 L840,98 L890,98" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="890,98 879.1511342957953,103.12855856280596 879.1511342957953,92.87144143719404" fill="#B85B16"/><path d="M785,190 L840,190 L840,122 L890,122" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="890,122 879.1511342957953,127.12855856280596 879.1511342957953,116.87144143719404" fill="#B85B16"/><text x="0" y="288" font-family="Segoe UI" font-size="22" font-weight="400" fill="#586F7B" text-anchor="start">Given character codes: A = 65, C = 67</text><text x="835" y="254" font-family="Segoe UI" font-size="22" font-weight="700" fill="#B85B16" text-anchor="start">Same hash</text></svg>