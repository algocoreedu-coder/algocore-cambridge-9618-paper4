<svg xmlns="http://www.w3.org/2000/svg" width="619" height="450" viewBox="-70 1 619 450" role="img" aria-labelledby="title desc"><title id="title">Sequential insertion: chèn đúng thứ tự key</title><desc id="desc">Từ 12,18,25,31 thêm 20 thành 12,18,20,25,31. Đánh dấu vị trí logic cần chèn; chú thích có thể cần tổ chức lại tệp, không hàm ý mọi hệ thống ghi đè tại chỗ.</desc><rect x="0" y="25" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="52.5" y="61.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">12</text><rect x="105" y="25" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="157.5" y="61.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">18</text><rect x="210" y="25" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="262.5" y="61.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">25</text><rect x="315" y="25" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="367.5" y="61.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">31</text><rect x="155" y="155" width="100" height="60" rx="9" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="205.0" y="192.82" font-family="Consolas" font-size="23" font-weight="700" fill="#B85B16" text-anchor="middle">20</text><path d="M205,143 L205,88" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round"/><polygon points="205,88 210.12855856280595,98.84886570420474 199.87144143719405,98.84886570420474" fill="#B85B16"/><text x="315" y="193" font-family="Consolas" font-size="25" font-weight="400" fill="#18364B" text-anchor="start">18 &lt; 20 &lt; 25</text><path d="M70,109 L-35,109 L-35,287 L70,287" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="70,287 59.151134295795266,292.12855856280595 59.151134295795266,281.87144143719405" fill="#007F83"/><rect x="0" y="310" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="52.5" y="346.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">12</text><rect x="105" y="310" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="157.5" y="346.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">18</text><rect x="210" y="310" width="105" height="55" rx="2" fill="#FFF1E2" stroke="#B85B16" stroke-width="2"/><text x="262.5" y="346.5" font-family="Consolas" font-size="25" font-weight="700" fill="#B85B16" text-anchor="middle">20</text><rect x="315" y="310" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="367.5" y="346.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">25</text><rect x="420" y="310" width="105" height="55" rx="2" fill="#EAF5F4" stroke="#9BAEB7" stroke-width="2"/><text x="472.5" y="346.5" font-family="Consolas" font-size="25" font-weight="700" fill="#007F83" text-anchor="middle">31</text><text x="0" y="422" font-family="Segoe UI" font-size="20" font-weight="400" fill="#586F7B" text-anchor="start">Key order maintained; file may need reorganisation</text></svg>