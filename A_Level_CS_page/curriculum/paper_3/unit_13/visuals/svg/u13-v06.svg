<svg xmlns="http://www.w3.org/2000/svg" width="1131" height="413" viewBox="-22 -50 1131 413" role="img" aria-labelledby="title desc"><title id="title">Record: từ định nghĩa đến một học viên</title><desc id="desc">Nối từng dòng TYPE TStudent tới field tương ứng trong record Learner; StudentID/FullName/Phone là STRING, LessonsAttended INTEGER, Status enum. Tô nổi đường Learner.FullName.</desc><text x="0" y="0" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="start">TYPE TStudent</text><rect x="630" y="20" width="455" height="263" rx="9" fill="#FFFFFF" stroke="#007F83" stroke-width="2"/><rect x="630" y="20" width="455" height="48" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="646" y="52" font-family="Consolas" font-size="23" font-weight="700" fill="#18364B" text-anchor="start">Learner : TStudent</text><text x="644" y="97" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">StudentID</text><text x="1071" y="97" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">AC027</text><rect x="632" y="112" width="451" height="41" rx="0" fill="#FFF1E2" stroke="none" stroke-width="2"/><path d="M630,111 L1085,111" fill="none" stroke="#9BAEB7" stroke-width="2"/><text x="644" y="140" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">FullName</text><text x="1071" y="140" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">Minh</text><path d="M630,154 L1085,154" fill="none" stroke="#9BAEB7" stroke-width="2"/><text x="644" y="183" font-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">Phone</text><text x="1071" y="183" font-family="Consolas" font-size="20" font-weight="400" fill="#007F83" text-anchor="end">0901234567</text><path d="M630,197 L1085,197" fill="none" stroke="#9BAEB7" stroke-width="2"/><text x="644" y="226" font-family="Consolas" font-s