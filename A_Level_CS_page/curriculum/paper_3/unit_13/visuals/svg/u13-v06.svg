-family="Consolas" font-size="20" font-weight="400" fill="#18364B" text-anchor="start">DECLARE Status : TStudyStatus</text><path d="M540,262 L624,262" fill="none" stroke="#9BAEB7" stroke-width="2.5" stroke-linejoin="round"/><polygon points="624,262 613.1511342957953,267.12855856280595 613.1511342957953,256.87144143719405" fill="#9BAEB7"/><text x="0" y="334" font-family="Consolas" font-size="23" font-weight="400" fill="#18364B" text-anchor="start">ENDTYPE</text><text x="645" y="334" font-family="Consolas" font-size="23" font-weight="400" fill="#B85B16" text-anchor="start">Learner.FullName → &quot;Minh&quot;</text></svg>