<svg xmlns="http://www.w3.org/2000/svg" width="894" height="357" viewBox="-24 -48 894 357" role="img" aria-labelledby="title desc"><title id="title">Pointer thay đổi gì khi dữ liệu đổi?</title><desc id="desc">Hai trạng thái Score=42 và Score=50; pointer vẫn giữ cùng địa chỉ. Đầu ra khi dereference đổi từ 42 sang 50.</desc><text x="0" y="0" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="start">Before</text><rect x="0" y="35" width="235" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="117.5" y="72.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">P = 0x0200</text><rect x="445" y="35" width="245" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="567.5" y="72.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Score = 42</text><path d="M245,65 L435,65" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="435,65 424.15113429579526,70.12855856280596 424.15113429579526,59.87144143719404" fill="#007F83"/><text x="340.0" y="53.0" font-family="Segoe UI" font-size="20" font-weight="400" fill="#007F83" text-anchor="middle">same address</text><text x="750" y="76" font-family="Consolas" font-size="25" font-weight="400" fill="#007F83" text-anchor="start">P^ → 42</text><text x="0" y="190" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="start">After Score ← 50</text><rect x="0" y="225" width="235" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="117.5" y="262.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">P = 0x0200</text><rect x="445" y="225" width="245" height="60" rx="9" fill="#FFF1E2" stroke="#007F83" stroke-width="2"/><text x="567.5" y="262.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Score = 50</text><path d="M245,255 L435,255" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="435,255 424.15113429579526,260.12855856280595 424.15113429579526,249.87144143719405" fill="#007F83"/><text x="340.0" y="243.0" font-family="Segoe UI" font-size="20" font-weight="400" fill="#007F83" text-anchor="middle">same address</text><text x="750" y="266" font-family="Consolas" font-size="25" font-weight="400" fill="#B85B16" text-anchor="start">P^ → 50</text></svg>