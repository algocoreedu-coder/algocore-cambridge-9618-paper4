<svg xmlns="http://www.w3.org/2000/svg" width="928" height="447" viewBox="-24 -45 928 447" role="img" aria-labelledby="title desc"><title id="title">Organisation và access là hai lớp khác nhau</title><desc id="desc">Lớp trên: quy tắc lưu serial/sequential/random. Lớp dưới: sequential/direct access. Nối serial→sequential; sequential→sequential và direct qua index; random→direct qua hash.</desc><text x="0" y="0" font-family="Segoe UI" font-size="20" font-weight="700" fill="#586F7B" text-anchor="start">ORGANISATION</text><text x="570" y="0" font-family="Segoe UI" font-size="20" font-weight="700" fill="#586F7B" text-anchor="start">ACCESS</text><rect x="0" y="40" width="255" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="127.5" y="77.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Serial</text><rect x="0" y="175" width="255" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="127.5" y="212.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Sequential</text><rect x="0" y="310" width="255" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="127.5" y="347.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Random</text><rect x="570" y="105" width="310" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="725.0" y="142.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Sequential access</text><rect x="570" y="290" width="310" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2"/><text x="725.0" y="327.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Direct access</text><path d="M266,70 L355,70 L355,126 L560,126" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round"/><polygon points="560,126 549.1511342957953,131