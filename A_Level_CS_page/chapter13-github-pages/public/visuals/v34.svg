<svg xmlns="http://www.w3.org/2000/svg" width="801" height="551" viewBox="-24.0 -49.0 801.0 551.0" role="img" aria-labelledby="title desc"><title id="title">A binary fraction that repeats</title><desc id="desc">Figure 34: A binary fraction that repeats. A teaching diagram for Chapter 13.</desc><text x="0" y="0" font-family="Segoe UI" font-size="24" font-weight="700" fill="#18364B" text-anchor="start">Non-terminating binary fraction</text><text x="0" y="65" font-family="Consolas" font-size="29" font-weight="400" fill="#18364B" text-anchor="start">0.1₁₀ = 0.00011001100110011…₂</text><path d="M224,81 L752,81" fill="none" stroke="#B85B16" stroke-width="3" /><text x="330" y="130" font-family="Segoe UI" font-size="21" font-weight="400" fill="#B85B16" text-anchor="start">repeating pattern continues</text><text x="0" y="232" font-family="Segoe UI" font-size="24" font-weight="700" fill="#18364B" text-anchor="start">Finite expansion, insufficient mantissa bits</text><text x="0" y="294" font-family="Consolas" font-size="28" font-weight="400" fill="#18364B" text-anchor="start">13.375 = 0.1101011₂ × 2^4</text><text x="0" y="337" font-family="Segoe UI" font-size="21" font-weight="700" fill="#007F83" text-anchor="start">6-bit M capacity</text><rect x="0" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="21.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><rect x="43" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="64.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="86" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="107.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="129" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="150.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><rect x="172" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="193.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="215" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="236.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">0</text><text x="288" y="337" font-family="Segoe UI" font-size="21" font-weight="700" fill="#BA3849" text-anchor="start">extra bits</text><rect x="288" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#BA3849" stroke-width="2" /><text x="309.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><rect x="331" y="354" width="43" height="49" rx="0" fill="#EAF5F4" stroke="#BA3849" stroke-width="2" /><text x="352.5" y="388" font-family="Consolas" font-size="25" font-weight="700" fill="#18364B" text-anchor="middle">1</text><path d="M273,339 L273,433" fill="none" stroke="#BA3849" stroke-width="3" stroke-dasharray="7 6" /><text x="0" y="473" font-family="Segoe UI" font-size="22" font-weight="400" fill="#586F7B" text-anchor="start">A longer finite mantissa can preserve these extra bits</text></svg>