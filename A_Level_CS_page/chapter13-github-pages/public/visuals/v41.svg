<svg xmlns="http://www.w3.org/2000/svg" width="836" height="400" viewBox="-32.5 -24.0 836.5 400.0" role="img" aria-labelledby="title desc"><title id="title">Read the action, result and limits</title><desc id="desc">Figure 41: Read the action, result and limits. A teaching diagram for Chapter 13.</desc><rect x="0" y="0" width="160" height="60" rx="9" fill="#FFFFFF" stroke="#007F83" stroke-width="2" /><text x="80.0" y="37.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">Calculate</text><rect x="180" y="0" width="240" height="60" rx="9" fill="#FFFFFF" stroke="#B85B16" stroke-width="2" /><text x="300.0" y="37.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#B85B16" text-anchor="middle">denary value</text><rect x="440" y="0" width="340" height="60" rx="9" fill="#FFFFFF" stroke="#18364B" stroke-width="2" /><text x="610.0" y="37.82" font-family="Segoe UI" font-size="23" font-weight="700" fill="#18364B" text-anchor="middle">M: 8 bits / E: 4 bits</text><path d="M80,68 L80,135" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round" /><polygon points="80,135 74.87144143719404,124.15113429579526 85.12855856280595,124.15113429579526" fill="#007F83" /><text x="80" y="178" font-family="Segoe UI" font-size="20" font-weight="700" fill="#007F83" text-anchor="middle">ACTION</text><text x="80" y="215" font-family="Segoe UI" font-size="21" font-weight="400" fill="#18364B" text-anchor="middle">calculate + working</text><path d="M300,68 L300,135" fill="none" stroke="#B85B16" stroke-width="2.5" stroke-linejoin="round" /><polygon points="300,135 294.87144143719405,124.15113429579526 305.12855856280595,124.15113429579526" fill="#B85B16" /><text x="300" y="178" font-family="Segoe UI" font-size="20" font-weight="700" fill="#B85B16" text-anchor="middle">RESULT</text><text x="300" y="215" font-family="Segoe UI" font-size="21" font-weight="400" fill="#18364B" text-anchor="middle">a denary value</text><path d="M610,68 L610,135" fill="none" stroke="#18364B" stroke-width="2.5" stroke-linejoin="round" /><polygon points="610,135 604.871441437194,124.15113429579526 615.128558562806,124.15113429579526" fill="#18364B" /><text x="610" y="178" font-family="Segoe UI" font-size="20" font-weight="700" fill="#18364B" text-anchor="middle">LIMITS</text><text x="610" y="215" font-family="Segoe UI" font-size="21" font-weight="400" fill="#18364B" text-anchor="middle">signed M and E</text><rect x="165" y="292" width="460" height="60" rx="9" fill="#EAF5F4" stroke="#007F83" stroke-width="2" /><text x="395.0" y="329.82" font-family="Consolas" font-size="23" font-weight="700" fill="#007F83" text-anchor="middle">M → E → X = M × 2^E</text><path d="M300,233 L300,285" fill="none" stroke="#007F83" stroke-width="2.5" stroke-linejoin="round" /><polygon points="300,285 294.87144143719405,274.15113429579526 305.12855856280595,274.15113429579526" fill="#007F83" /></svg>